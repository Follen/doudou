[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "doudou"
version = "2.0.1"
description = "Project-local Camoufox broker and structured Douyin workflow CLI"
requires-python = ">=3.10,<4.0"
dependencies = [
  "camoufox==0.5.4",
  "cryptography==50.0.0",
]

[project.scripts]
doudou = "doudou.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
