name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
            bin: doudou.exe
            cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
            bin: doudou
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
            bin: doudou
            cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: tar.gz
            bin: doudou
            cross: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Verify release version consistency & Skill manifest
        if: ${{ !matrix.cross }}
        run: |
          npm run check:release
          npm run check:manifest
          npm test
          npm run test:pack
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Check Rust formatting and Clippy
        if: ${{ !matrix.cross }}
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust workspace tests
        if: ${{ !matrix.cross }}
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p doudou-cli

      - name: Smoke-check native binary and npm launcher
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          "$BIN" --version
          "$BIN" cli search send --json > /dev/null
          "$BIN" cli schema doctor > /dev/null
          DOUDOU_BINARY="$BIN" DOUDOU_HOME="${{ runner.temp }}/doudou-home" \
            node npm/bin/doudou.mjs --skill-dir "${{ runner.temp }}/doudou-skill" cli schema doctor > /dev/null

      - name: Package release archive (Windows)
        if: ${{ matrix.ext == 'zip' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $src = "target/${{ matrix.target }}/release/${{ matrix.bin }}"
          $dst = "dist/doudou-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -LiteralPath $src -DestinationPath $dst -Force

      - name: Package release archive (Unix)
        if: ${{ matrix.ext == 'tar.gz' }}
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/doudou-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" "${{ matrix.bin }}"

      - name: Upload release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/doudou-*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          sha256sum doudou-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber
          else
            gh release create "${{ github.ref_name }}" dist/* \
              --title "Doudou ${{ github.ref_name }}" \
              --generate-notes
          fi

  publish:
    name: Publish @follenfang/doudou
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Trusted Publishing capable npm
        run: npm install --global "npm@^11.5.1"

      - name: Verify release version, manifest, and package inventory
        run: |
          npm run check:release
          npm run check:manifest
          npm run test:pack
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Verify GitHub Release checksums are publicly reachable
        run: |
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SHA256SUMS.txt"

      - name: Publish with Trusted Publishing
        run: npm publish --access public
