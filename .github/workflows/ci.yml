name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release -p doudou-cli

      - name: Run npm wrapper tests and package checks
        run: |
          npm run check:manifest
          npm test
          npm run test:pack

      - name: Smoke-check CLI discovery
        shell: bash
        run: |
          BIN="target/release/doudou"
          if [ -f "target/release/doudou.exe" ]; then
            BIN="target/release/doudou.exe"
          fi
          "$BIN" --version
          "$BIN" cli search send --json > /dev/null
          "$BIN" cli schema doctor > /dev/null
          DOUDOU_BINARY="$BIN" DOUDOU_HOME="${{ runner.temp }}/doudou-home" \
            node npm/bin/doudou.mjs --skill-dir "${{ runner.temp }}/doudou-skill" cli schema doctor > /dev/null
