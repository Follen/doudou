name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install npm package without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install Python verification tools
        run: python -m pip install --disable-pip-version-check pytest ruff cryptography
      - name: Check release versions
        run: npm run check:release
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Run Node tests
        run: npm test
      - name: Check Skill manifest
        run: npm run check:manifest
      - name: Verify package inventory and credentials
        run: npm run test:pack
      - name: Test global, npx, and ignore-scripts installs
        run: npm run test:install
      - name: Cache Doudou downloads and dedicated browser
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/doudou-home/downloads
            ${{ runner.temp }}/doudou-home/browsers
          key: doudou-runtime-${{ runner.os }}-${{ hashFiles('doudou/scripts/runtime-manifest.json') }}
      - name: Run managed runtime setup and browser launch probe
        run: |
          node npm/bin/doudou.mjs setup
          node npm/bin/doudou.mjs --data-root "${{ runner.temp }}/doudou-project" doctor --launch-probe
        env:
          DOUDOU_HOME: ${{ runner.temp }}/doudou-home
      - name: Run Python tests
        run: python -m pytest docs/verification/tests -q
        env:
          PYTHONPATH: doudou/scripts
      - name: Run Ruff
        run: python -m ruff check doudou/scripts docs/verification/tests

  publish:
    name: Publish @follenfang/doudou
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install Trusted Publishing capable npm
        run: npm install --global "npm@^11.5.1"
      - name: Install npm package without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check release versions
        run: npm run check:release
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Check Skill manifest
        run: npm run check:manifest
      - name: Verify package inventory and credentials
        run: npm run test:pack
      - name: Publish with Trusted Publishing
        run: npm publish --access public
